<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000;
            color:#ff3333;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .container{
            text-align:center;
            border:4px solid red;
            padding:50px;
            border-radius:12px;
            box-shadow:0 0 30px red;
            animation:glow 1s infinite alternate;
        }

        h1{
            font-size:60px;
            margin-bottom:20px;
            text-transform:uppercase;
            animation:blink .7s infinite;
        }

        h2{
            color:#fff;
            margin-bottom:20px;
        }

        p{
            color:#ddd;
            font-size:20px;
            margin:10px 0;
        }

        .signature{
            color:#00ff00;
            font-size:28px;
            margin-top:30px;
            font-weight:bold;
        }

        @keyframes blink{
            50%{
                opacity:0;
            }
        }

        @keyframes glow{
            from{
                box-shadow:0 0 15px red;
            }
            to{
                box-shadow:0 0 45px red;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚠ YOUR SYSTEM IS HACKED ⚠</h1>

    <h2>All your files have been encrypted.</h2>

    <p>Do not turn off your computer.</p>
    <p>This is only a demonstration page.</p>

    <div class="signature">
        Hacked by Saul Goodman
    </div>
</div>

</body>
</html>
